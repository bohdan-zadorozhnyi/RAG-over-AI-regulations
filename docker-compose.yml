services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: regrag
      POSTGRES_PASSWORD: regrag
      POSTGRES_DB: regrag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regrag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
