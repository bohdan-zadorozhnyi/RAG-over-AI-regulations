[project]
name = "regrag"
version = "0.1.0"
description = "Retrieval over EU AI and data regulation with article-level citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=6.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langchain-text-splitters>=0.3",
    "langfuse>=2.50",
    "boto3>=1.35",
    "transformers>=5.0",
    "anthropic>=2.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "types-pyyaml"]

[project.scripts]
regrag = "regrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
